[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "trakklicense"
dynamic = ["version"]
description = "Offline beat-license generator for beatmakers"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<7",
    "reportlab>=4.0",
]

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}
